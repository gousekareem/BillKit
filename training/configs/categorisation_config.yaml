# Expense categorisation baseline: TF-IDF features + linear models, compared against keyword rules.
data:
  examples: training/categorisation/data/seed_examples.csv   # generated by generate_seed_data.py (SYNTHETIC)
  text_column: text
  label_column: category
  group_column: template_id      # cross-validation groups — prevents near-duplicate leakage
features:
  analyzer: word
  ngram_range: [1, 2]
  min_df: 1
  sublinear_tf: true
models: [logistic_regression, multinomial_nb]
cv_folds: 5
seed: 20261106
export:
  version_prefix: billkit-tfidf-lr
  output_dir: ai/models/categoriser
